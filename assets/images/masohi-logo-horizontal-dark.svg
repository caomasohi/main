<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <clipPath id="hClipDark">
      <circle cx="32" cy="32" r="28" />
    </clipPath>
  </defs>

  <!-- Emblem -->
  <g id="hEmblemDark">
